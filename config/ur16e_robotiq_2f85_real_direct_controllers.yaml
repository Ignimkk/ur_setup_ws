# ur16e_robotiq_2f85_real_direct_controllers.yaml
#
# 실물 UR16e + Robotiq 2F-85 direct Modbus 테스트용 ros2_control 컨트롤러 설정.
# ur_ros2_control_node (ur_robot_driver) 가 이 파일을 읽어 controller_manager 를 구동.
#
# sim 용 ur16e_robotiq_2f85_controllers.yaml 과 차이점:
#   - 기본 trajectory controller 는 scaled_joint_trajectory_controller
#     (UR Polyscope 의 speed slider 와 연동)
#   - update_rate=500 은 ur16e 실시간 주기와 일치 (ur_description ur16e_update_rate.yaml 와 동일)
#   - UR + Robotiq joint 만 ros2_control 인터페이스에 포함됨
#     (pedestal/plate/pallet 은 fixed joint → 자동 제외)

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, UR16e 실시간 제어 주기

    # Direct Modbus 모드에서는 /tmp/ttyUR 또는 USB-RS485가 실제 통신 가능해진 뒤
    # 사용자가 명시적으로 robotiq_2f_85를 configure/activate해야 한다.
    # startup 중 자동 활성화하면 통신 실패가 UR controller_manager bring-up을
    # 방해할 수 있다.
    hardware_components_initial_state:
      unconfigured:
        - robotiq_2f_85

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    # Robotiq 2F-85 (실물 RS-485)
    robotiq_gripper_controller:
      type: position_controllers/GripperActionController
    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: tool0_controller
    topic_name: ft_data

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint:  { trajectory: 0.2, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      elbow_joint:         { trajectory: 0.2, goal: 0.1 }
      wrist_1_joint:       { trajectory: 0.2, goal: 0.1 }
      wrist_2_joint:       { trajectory: 0.2, goal: 0.1 }
      wrist_3_joint:       { trajectory: 0.2, goal: 0.1 }

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: speed_scaling/speed_scaling_factor
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint:  { trajectory: 0.2, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      elbow_joint:         { trajectory: 0.2, goal: 0.1 }
      wrist_1_joint:       { trajectory: 0.2, goal: 0.1 }
      wrist_2_joint:       { trajectory: 0.2, goal: 0.1 }
      wrist_3_joint:       { trajectory: 0.2, goal: 0.1 }

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    use_effort_interface: true
    use_speed_interface: true
    # 실물 그리퍼의 stall detection 은 hardware 가 직접 수행하므로,
    # action 측 임계값은 비교적 헐겁게 둠.
    stall_velocity_threshold: 0.05
    stall_timeout: 1.0
    goal_tolerance: 0.05

robotiq_activation_controller:
  ros__parameters:
    default: true
